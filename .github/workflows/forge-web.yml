name: forge-web

on:
  push:
    branches: [main]
    paths:
      - "apps/forge-web/**"          # only when the app changes
      - ".github/workflows/forge-web.yml"
  workflow_dispatch:                 # "Run workflow" button in GitHub

permissions:
  contents: read                     # read the code
  packages: write                    # push to GHCR
  id-token: write                    # get an OIDC identity → keyless signing

env:
  IMAGE: ghcr.io/devil6sidekick/forge-web

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: docker build -t $IMAGE:${{ github.sha }} apps/forge-web

      - name: Scan with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push to GHCR
        id: push
        run: |
          docker push $IMAGE:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign the image (keyless)
        run: cosign sign --yes ${{ steps.push.outputs.digest }}