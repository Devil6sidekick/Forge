apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Devil6sidekick/forge.git
    targetRevision: main
    path: gitops/apps/podinfo
  destination:
    name: apps                   # ← the cluster registered in step D (not the hub!)
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true